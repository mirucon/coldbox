name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp: latest
            php: '8.3'
          - wp: latest
            php: '8.5'
          - wp: '6.2'
            php: '7.4'
    name: WordPress ${{ matrix.wp }} / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Build the installable package
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile --non-interactive
          yarn build
      - name: Install pinned test tools
        run: npm ci --prefix tests --ignore-scripts
      - name: Exercise WordPress and check PHP errors
        env:
          WP_VERSION: ${{ matrix.wp }}
          PHP_VERSION: ${{ matrix.php }}
        run: npm test --prefix tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.wp == 'latest' && matrix.php == '8.3'
        with:
          name: coldbox-unreleased-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
