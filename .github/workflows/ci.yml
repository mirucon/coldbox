name: CI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths-ignore:
      - 'AGENTS.md'
      - 'MAINTENANCE.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wp: '7.0', php: '7.4' }
          - { wp: '7.1', php: '7.4' }
          - { wp: '7.1', php: '8.3' }
          - { wp: '7.1', php: '8.5' }
    name: WordPress ${{ matrix.wp }} / PHP ${{ matrix.php }}
    services:
      mysql:
        image: mysql:lts@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8
        env:
          MYSQL_ROOT_PASSWORD: coldbox-test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pcoldbox-test" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      WP_VERSION: ${{ matrix.wp }}
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: coldbox-test
      COLDBOX_THEME_DIR: ${{ github.workspace }}/dist
      COLDBOX_ADDON_DIR: ${{ github.workspace }}/companion/dist
      COLDBOX_TEST_RUNTIME: ${{ github.workspace }}/.test-runtime
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: mirucon/coldbox-addon
          path: companion
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Read WP-CLI release pin
        id: wpcli
        run: |
          read -r version sha256 < tests/wp-cli.lock
          echo "tool=wp-cli:$version@sha256:$sha256" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, dom
          tools: composer:v2, ${{ steps.wpcli.outputs.tool }}
          coverage: none
        env:
          fail-fast: true
      - name: Build installable packages
        run: |
          npm ci
          npm run build
          node companion/bin/package.mjs
      - name: Check distribution PHP syntax
        run: find dist -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install native WordPress tests
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          mysql -h127.0.0.1 -uroot -pcoldbox-test -e 'CREATE DATABASE coldbox_test; CREATE DATABASE coldbox_browser;'
          bash tests/install.sh
      - name: Test real WordPress with MySQL
        run: composer test
      - name: Browser checks
        env:
          COLDBOX_WP_CLI: wp
        working-directory: .
        run: |
          # The runner's Azure mirror can stall before browser tests start.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium firefox webkit
          bash tests/browser-install.sh
          php -S 127.0.0.1:8874 -t "$COLDBOX_TEST_RUNTIME/wordpress" "$PWD/tests/router.php" > "$COLDBOX_TEST_RUNTIME/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in {1..30}; do curl --max-time 5 -fsS http://127.0.0.1:8874/ >/dev/null && break || sleep 1; done
          if [ '${{ matrix.php }}' = '8.3' ]; then
            npm run test:browser
          else
            npm run test:browser -- --project=chromium --project=webkit-mobile
          fi
          if [ -s "$COLDBOX_TEST_RUNTIME/wordpress/wp-content/debug.log" ]; then cat "$COLDBOX_TEST_RUNTIME/wordpress/wp-content/debug.log"; exit 1; fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-evidence-wp-${{ matrix.wp }}-php-${{ matrix.php }}
          include-hidden-files: true
          path: |
            test-results/
            .test-runtime/*.log
            .test-runtime/wordpress/wp-content/debug.log
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.wp == '7.1' && matrix.php == '8.3'
        with:
          name: coldbox-unreleased-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
